name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install Node for browser regression tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run --no-sync ruff check src tests scripts --no-cache
      - name: Test
        run: uv run --no-sync pytest -q -p no:cacheprovider
      - name: Build distributions
        run: uv build
      - name: Verify license, resources and package contents
        run: uv run --no-sync python scripts/check_distribution.py
